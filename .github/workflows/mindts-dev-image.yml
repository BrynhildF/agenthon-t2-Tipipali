# ## Executive summary (read this first)
# Manually validate and publish team 188's Development candidate, never submit to CodaBench.
# Use GitHub's scoped package token only. Never give this workflow a Team Key.
name: MindTS Development image (team 188)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mindts-development-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brynhildf/agenthon-t2-tipipali
  PYTHONUTF8: "1"

jobs:
  candidate:
    if: github.repository == 'BrynhildF/agenthon-t2-Tipipali'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install pinned toolkit and participant test dependencies
        run: |
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "pyarrow==18.1.0" "jsonschema==4.23.0"
          python -m pip install "qfbench2-common @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.6.0.tar.gz#subdirectory=common"
          python -m pip install -e ".[test,dev]"
      - name: Participant tests and lint
        run: |
          python -m pytest tests/test_mindts_agent.py tests/test_mindts_submission.py
          ruff check qfbench2_track_forecasting/mindts*.py qfbench2_track_forecasting/horizons.py qfbench2_track_forecasting/targets.py tests/test_mindts*.py
          ruff format --check qfbench2_track_forecasting/mindts*.py qfbench2_track_forecasting/horizons.py qfbench2_track_forecasting/targets.py tests/test_mindts*.py
          mypy --strict --ignore-missing-imports --follow-imports=silent qfbench2_track_forecasting/mindts*.py qfbench2_track_forecasting/horizons.py qfbench2_track_forecasting/targets.py
      - name: Fetch released shared-toolkit tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: 683e70c9c44eca947699a72bea79147a5d4d8c7a # v2.6.0
          path: .official-toolkit
          persist-credentials: false
      - name: Shared toolkit tests on Linux (including secure packing and manifest checks)
        run: python -m pytest .official-toolkit/common
      - name: Fetch pinned current official tasks and scorer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Agenthon-2026/track2-forecasting-public
          ref: a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec
          path: .official-track
          persist-credentials: false
      - name: Full official Linux smoke for every public task
        run: |
          python -m qfbench2_track_forecasting.mindts_validate --official-track .official-track --out-dir out/dev-validation
      - name: Build linux amd64 image without publishing
        run: |
          docker build --platform linux/amd64 -f Dockerfile.mindts \
            --label "org.opencontainers.image.source=https://github.com/BrynhildF/agenthon-t2-Tipipali" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:dev-${GITHUB_SHA}" .
          test "$(docker image inspect "${IMAGE}:dev-${GITHUB_SHA}" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "${IMAGE}:dev-${GITHUB_SHA}" --format '{{json .Config.Volumes}}')" = null
      - name: Container read-only and network-none smoke
        run: |
          install -d -m 0777 out/container-smoke
          unit="${GITHUB_WORKSPACE}/.official-track/units/t2-EXAMPLE-ust-curve-1m"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --pids-limit 256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --cpus 2 --memory 4g --memory-swap 4g \
            -e QFBENCH_NETWORK=none -e QFBENCH_SEED=188 \
            -v "${unit}:/input:ro" -v "${GITHUB_WORKSPACE}/out/container-smoke:/output" \
            "${IMAGE}:dev-${GITHUB_SHA}" forecast --panels /input/panels --text /input/text \
            --asof 2024-06-28 --out /output/forecast.parquet
          cd .official-track
          PYTHONPATH="$PWD" python -m qfbench2_common.smoke units/t2-EXAMPLE-ust-curve-1m ../out/container-smoke --track forecasting
      - name: Publish the tested image and record actual registry digest
        env:
          GH_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_PACKAGE_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:dev-${GITHUB_SHA}"
          python - <<'PY'
          import json, os, pathlib, subprocess
          image = os.environ['IMAGE']
          sha = os.environ['GITHUB_SHA']
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image + ':dev-' + sha]))[0]
          digests = [d.split('@', 1)[1] for d in info['RepoDigests'] if d.startswith(image + '@')]
          if len(set(digests)) != 1:
              raise SystemExit('No unique pushed registry digest; refusing descriptor creation')
          out = pathlib.Path('out/dev-release')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'image-metadata.json').write_text(json.dumps({
              'containerimage.digest': digests[0], 'image': image, 'source_revision': sha,
              'official_track_revision': 'a2c93e7b66b8c6a6c429fda81d6bc7873b7c5dec',
              'toolkit': '2.6.0', 'phase': 'dev',
          }, indent=2) + '\n', encoding='utf-8')
          PY
          python -m qfbench2_track_forecasting.mindts_submission --image-metadata out/dev-release/image-metadata.json --out-dir out/dev-release
          cp ARTIFACT_PROVENANCE.md out/dev-release/
          cp out/dev-validation/validation-summary.json out/dev-release/
      - name: Verify anonymous public pull (make the GHCR package public if this fails)
        run: |
          digest=$(python -c "import json; print(json.load(open('out/dev-release/image-metadata.json'))['containerimage.digest'])")
          anonymous_config=$(mktemp -d)
          docker --config "$anonymous_config" pull --platform linux/amd64 "${IMAGE}@${digest}"
      - name: Save digest and draft even if the package still needs public visibility
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: team188-development-draft
          path: out/dev-release/
          if-no-files-found: warn
          retention-days: 30
